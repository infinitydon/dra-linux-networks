{{- if .Values.controller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linux-net-dra.fullname" . }}-controller
  labels:
    {{- include "linux-net-dra.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "linux-net-dra.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "linux-net-dra.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "linux-net-dra.fullname" . }}
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: {{ include "linux-net-dra.name" . }}
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: controller
      nodeSelector:
        {{- toYaml .Values.controller.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.controller.tolerations | nindent 8 }}
      containers:
        - name: controller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/linux-net-controller
          args:
            - --reconcile-interval={{ .Values.controller.reconcileInterval }}
            - --leader-elect={{ .Values.controller.leaderElection.enabled }}
            - --leader-election-lease-name={{ .Values.controller.leaderElection.leaseName }}
            - --leader-election-lease-namespace={{ .Release.Namespace }}
            - --leader-election-lease-duration={{ .Values.controller.leaderElection.leaseDuration }}
            - --leader-election-renew-deadline={{ .Values.controller.leaderElection.renewDeadline }}
            - --leader-election-retry-period={{ .Values.controller.leaderElection.retryPeriod }}
            - --leader-election-health-timeout={{ .Values.controller.leaderElection.healthTimeout }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: healthz
              containerPort: 9179
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 2
            periodSeconds: 5
{{- end }}
