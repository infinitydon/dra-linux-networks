apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "linux-net-dra.fullname" . }}
  labels:
    {{- include "linux-net-dra.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["events", "pods", "nodes"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["linux-net.dra.infinitydon.com"]
    resources: ["ippools"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["linux-net.dra.infinitydon.com"]
    resources: ["ippools/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["linux-net.dra.infinitydon.com"]
    resources: ["ipallocations"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "linux-net-dra.fullname" . }}
  labels:
    {{- include "linux-net-dra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "linux-net-dra.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "linux-net-dra.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "linux-net-dra.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "linux-net-dra.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "linux-net-dra.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "linux-net-dra.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "linux-net-dra.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "linux-net-dra.fullname" . }}
    namespace: {{ .Release.Namespace }}
