{{- range .Values.deviceClasses }}
{{- if .create }}
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: {{ .name }}
  labels:
    {{- include "linux-net-dra.labels" $ | nindent 4 }}
spec:
  selectors:
    - cel:
        expression: >-
          device.driver == {{ $.Values.driverName | squote }} &&
          device.attributes[{{ $.Values.driverName | squote }}].{{ .attribute }} == true
{{- end }}
{{- end }}
