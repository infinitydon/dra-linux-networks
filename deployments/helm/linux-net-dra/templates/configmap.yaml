apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "linux-net-dra.fullname" . }}-config
  labels:
    {{- include "linux-net-dra.labels" . | nindent 4 }}
data:
  config.json: |
    {
      "driverName": {{ .Values.driverName | quote }},
      "interfaces": {{ .Values.interfaces | toJson }},
      "dpdk": {{ .Values.dpdk | toJson }},
      "ipPools": []
    }
