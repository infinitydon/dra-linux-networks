image:
  repository: ghcr.io/infinitydon/dra-linux-networks
  tag: "0.3.3"
  pullPolicy: IfNotPresent

driverName: linux-net.dra.infinitydon.com

nodeSelector:
  linux-net.dra.infinitydon.com/enabled: "true"

tolerations: []

priorityClassName: system-node-critical

controller:
  enabled: true
  replicas: 2
  reconcileInterval: 30s
  leaderElection:
    enabled: true
    leaseName: linux-net-dra-controller
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
    healthTimeout: 20s
  nodeSelector: {}
  tolerations: []

kubelet:
  pluginsDir: /var/lib/kubelet/plugins
  registrationDir: /var/lib/kubelet/plugins_registry

nri:
  socketDir: /var/run/nri

state:
  hostPath: /var/run/linux-net-dra
  file: /var/run/linux-net-dra/state.json

dpdk:
  enabled: false
  allowUnsafeNoIOMMU: false
  sysfsPath: /host/sys
  devPath: /host/dev
  cdiHostDevPath: /dev
  cdiPath: /var/run/cdi
  pciIDPath: /usr/share/misc/pci.ids
  modulesPath: /host/lib/modules
  drivers:
    - vfio-pci
  pciClasses:
    - "0200"
  include:
    vendors: []
    devices: []
    pciAddresses: []
  exclude:
    vendors: []
    devices: []
    pciAddresses: []
  compatibleDriverOverrides: {}

# Node-local interfaces are operator inventory and must be supplied in a
# separate values file. The chart never advertises a host interface by default.
interfaces: []

deviceClasses:
  - create: true
    name: linux-net-macvlan
    type: macvlan
    attribute: macvlan
  - create: true
    name: linux-net-ipvlan
    type: ipvlan
    attribute: ipvlan
  - create: true
    name: linux-net-host-device
    type: host-device
    attribute: hostDevice
  - create: true
    name: linux-net-dpdk
    type: dpdk
    attribute: dpdk
