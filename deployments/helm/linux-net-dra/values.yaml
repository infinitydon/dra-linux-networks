image:
  repository: ghcr.io/infinitydon/dra-linux-networks
  tag: "0.5.1"
  pullPolicy: IfNotPresent

driverName: linux-net.dra.infinitydon.com

nodeSelector:
  linux-net.dra.infinitydon.com/enabled: "true"

tolerations: []

priorityClassName: system-node-critical

controller:
  enabled: true
  replicas: 2
  reconcileInterval: 30s
  leaderElection:
    enabled: true
    leaseName: linux-net-dra-controller
    leaseDuration: 15s
    renewDeadline: 10s
    retryPeriod: 2s
    healthTimeout: 20s
  nodeSelector: {}
  tolerations: []

kubelet:
  pluginsDir: /var/lib/kubelet/plugins
  registrationDir: /var/lib/kubelet/plugins_registry

nri:
  socketDir: /var/run/nri

state:
  hostPath: /var/run/linux-net-dra
  file: /var/run/linux-net-dra/state.json

# DPDK devices are discovered from PCI/sysfs independently of interfaces.
# Enable this only on labeled nodes prepared with a supported userspace driver.
dpdk:
  enabled: false
  allowUnsafeNoIOMMU: false
  sysfsPath: /host/sys
  devPath: /host/dev
  cdiHostDevPath: /dev
  cdiPath: /var/run/cdi
  pciIDPath: /usr/share/misc/pci.ids
  modulesPath: /host/lib/modules
  # Currently bound host kernel drivers that should be advertised as DPDK-ready.
  # Add uio_pci_generic or igb_uio here if your nodes use UIO instead of VFIO.
  allowedKernelDrivers:
    - vfio-pci
  pciClasses:
    - "0200"
  include:
    vendors: []
    devices: []
    pciAddresses: []
  exclude:
    vendors: []
    devices: []
    pciAddresses: []
  compatibleDriverOverrides: {}

# Node-local interfaces are operator inventory. Replace this empty list in an
# environment-specific values file. The chart never advertises a host interface
# by default.
interfaces: []

# Example inventory:
# interfaces:
#   # Shared parent: multiple Pods may create macvlan or ipvlan children.
#   - name: enp8s20
#     default: true
#     allocationPolicy: shared
#     types:
#       - macvlan
#       - ipvlan
#     macvlanModes:
#       - bridge
#       - private
#       - vepa
#       - passthru
#     ipvlanModes:
#       - l2
#       - l3
#       - l3s
#     defaultType: macvlan
#     defaultMode: bridge
#     defaultPodInterfaceName: net1
#     mtu: 1500
#
#   # Exclusive pool member: the complete NIC is moved into one Pod at a time.
#   - name: enp8s21
#     default: false
#     allocationPolicy: exclusive
#     types:
#       - host-device
#     defaultType: host-device
#     defaultPodInterfaceName: enp8s21
#     mtu: 1500
#     allowUnsafe: false
#
#   - name: enp8s22
#     default: false
#     allocationPolicy: exclusive
#     types:
#       - host-device
#     defaultType: host-device
#     defaultPodInterfaceName: enp8s22
#     mtu: 1500
#     allowUnsafe: false

deviceClasses:
  - create: true
    name: linux-net-macvlan
    type: macvlan
    attribute: macvlan
  - create: true
    name: linux-net-ipvlan
    type: ipvlan
    attribute: ipvlan
  - create: true
    name: linux-net-host-device
    type: host-device
    attribute: hostDevice
  - create: true
    name: linux-net-dpdk
    type: dpdk
    attribute: dpdk
