name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: go test ./...
      - run: go test -tags=e2e ./tests/e2e -run '^$'

  image:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/infinitydon/dra-linux-networks:0.3.6
            ghcr.io/infinitydon/dra-linux-networks:latest
      - name: Detect DPDK test image changes
        id: dpdk-image
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- tests/images/dpdk-testpmd; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: steps.dpdk-image.outputs.changed == 'true'
        with:
          context: tests/images/dpdk-testpmd
          push: true
          tags: ghcr.io/infinitydon/dra-linux-networks-dpdk-testpmd:0.3.0
          cache-from: type=gha,scope=dpdk-testpmd
          cache-to: type=gha,mode=max,scope=dpdk-testpmd
