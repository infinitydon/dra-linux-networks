# Replace interface names and policies with inventory appropriate for your nodes.
interfaces:
  - name: eth1
    default: true
    allocationPolicy: shared
    types:
      - macvlan
      - ipvlan
    macvlanModes: [bridge, private, vepa, passthru]
    ipvlanModes: [l2, l3, l3s]
    defaultType: macvlan
    defaultMode: bridge
    defaultPodInterfaceName: net1
    mtu: 1500

  - name: eth2
    default: false
    allocationPolicy: shared
    types:
      - macvlan
      - ipvlan
    macvlanModes: [bridge, private, vepa, passthru]
    ipvlanModes: [l2, l3, l3s]
    defaultType: macvlan
    defaultMode: bridge
    defaultPodInterfaceName: net1
    mtu: 1500

  - name: eth3
    default: false
    allocationPolicy: exclusive
    types:
      - host-device
    defaultType: host-device
    defaultPodInterfaceName: eth3
    mtu: 1500
    allowUnsafe: false

# DPDK PCI discovery is independent of the interface list and is opt-in.
dpdk:
  enabled: false
