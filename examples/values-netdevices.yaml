# Inventory used by the example cluster. Replace it for other environments.
interfaces:
  - name: enp8s20
    default: true
    allocationPolicy: shared
    types:
      - macvlan
      - ipvlan
    macvlanModes: [bridge, private, vepa, passthru]
    ipvlanModes: [l2, l3, l3s]
    defaultType: macvlan
    defaultMode: bridge
    defaultPodInterfaceName: net1
    mtu: 1500

  - name: enp8s21
    default: false
    allocationPolicy: exclusive
    types:
      - host-device
    defaultType: host-device
    defaultPodInterfaceName: enp8s21
    mtu: 1500
    allowUnsafe: false

  - name: enp8s22
    default: false
    allocationPolicy: exclusive
    types:
      - host-device
    defaultType: host-device
    defaultPodInterfaceName: enp8s22
    mtu: 1500
    allowUnsafe: false

# DPDK PCI discovery is independent of the interface list and is opt-in.
dpdk:
  enabled: true
  allowUnsafeNoIOMMU: true
  allowedKernelDrivers:
    - vfio-pci
  include:
    pciAddresses:
      - "0000:01:00.0"
      - "0000:02:00.0"
      - "0000:03:00.0"
      - "0000:04:00.0"
      - "0000:05:00.0"
      - "0000:09:03.0"
      - "0000:09:04.0"
