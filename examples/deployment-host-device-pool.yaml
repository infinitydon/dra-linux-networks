apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: linux-net-host-device-pool
spec:
  spec:
    devices:
      requests:
        - name: nic
          exactly:
            deviceClassName: linux-net-host-device
            selectors:
              - cel:
                  expression: >-
                    device.attributes["linux-net.dra.infinitydon.com"].kernelDriver == "e1000"
      config:
        - requests: ["nic"]
          opaque:
            driver: linux-net.dra.infinitydon.com
            parameters:
              type: host-device
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-net-host-device-pool
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linux-net-host-device-pool
  template:
    metadata:
      labels:
        app: linux-net-host-device-pool
    spec:
      readinessGates:
        - conditionType: linux-net.dra.infinitydon.com/NetworkReady
      resourceClaims:
        - name: nic
          resourceClaimTemplateName: linux-net-host-device-pool
      containers:
        - name: shell
          image: nicolaka/netshoot:v0.15@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
          command: ["sleep", "3600"]
          resources:
            claims:
              - name: nic
