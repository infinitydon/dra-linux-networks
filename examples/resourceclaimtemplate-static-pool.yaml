apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: linux-net-static-pool
spec:
  spec:
    devices:
      requests:
        - name: net1
          exactly:
            deviceClassName: linux-net-macvlan
      config:
        - requests: ["net1"]
          opaque:
            driver: linux-net.dra.infinitydon.com
            parameters:
              type: macvlan
              mode: bridge
              interfaceName: net1
              mtu: 9000
              ipPool: lan-88
---
apiVersion: v1
kind: Pod
metadata:
  name: linux-net-static-pool-test
  annotations:
    linux-net.dra.infinitydon.com/net1.ip-pool: lan-88
    linux-net.dra.infinitydon.com/net1.address: 192.168.88.10/24
spec:
  restartPolicy: Never
  resourceClaims:
    - name: net1
      resourceClaimTemplateName: linux-net-static-pool
  containers:
    - name: shell
      image: nicolaka/netshoot:v0.15@sha256:47b907d662d139d1e2f22bfe14f4efca1e3f1feed283572f47c970c780c03b61
      command: ["sleep", "3600"]
      resources:
        claims:
          - name: net1
