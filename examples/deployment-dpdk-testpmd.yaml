apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: linux-net-dpdk
spec:
  spec:
    devices:
      requests:
        - name: dpdk
          exactly:
            deviceClassName: linux-net-dpdk
            selectors:
              - cel:
                  expression: >-
                    device.attributes['linux-net.dra.infinitydon.com'].pciVendorID == '8086' &&
                    device.attributes['linux-net.dra.infinitydon.com'].pciDeviceID == '154c'
      config:
        - requests: ["dpdk"]
          opaque:
            driver: linux-net.dra.infinitydon.com
            parameters:
              type: dpdk
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-net-dpdk-testpmd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: linux-net-dpdk-testpmd
  template:
    metadata:
      labels:
        app: linux-net-dpdk-testpmd
    spec:
      readinessGates:
        - conditionType: linux-net.dra.infinitydon.com/NetworkReady
      resourceClaims:
        - name: dpdk
          resourceClaimTemplateName: linux-net-dpdk
      containers:
        - name: testpmd
          image: ghcr.io/infinitydon/dra-linux-networks-dpdk-testpmd:0.3.0@sha256:5c90373e2ef12cfaa0c2fafaa09d75df25d7d3e6ad2eea6aaf7ba5fe61b86896
          securityContext:
            capabilities:
              add: ["IPC_LOCK", "SYS_RAWIO"]
          resources:
            requests:
              cpu: "2"
              memory: 512Mi
              hugepages-1Gi: 2Gi
            limits:
              cpu: "2"
              memory: 512Mi
              hugepages-1Gi: 2Gi
            claims:
              - name: dpdk
          volumeMounts:
            - name: hugepages
              mountPath: /dev/hugepages
      volumes:
        - name: hugepages
          emptyDir:
            medium: HugePages
